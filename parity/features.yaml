# Feature parity manifest, read by tools/ParityCheck (docs/LINUX-UNO-ROADMAP.md §6.2).
# Source of truth for WHAT exists and WHERE. Every UI change updates this file.
#
#   id:         page.section[.detail], lowercase, dot-separated
#   since:      app version that introduced the feature ("0.44" = already in the S5 inventory)
#   page:       logical page name from pages.yaml
#   viewmodel:  ViewModel that owns the behaviour (optional for platform-only features)
#   status:     maui | desktop | web | tv  →  done | todo (declared debt) | limited | n/a
#   notes:      required for limited and n/a; also used for planned limitations of todo items
#   tvNotes:    the same for status.tv (required when tv is limited or n/a); 'notes' speaks about the other platforms
#
# 'tv' is Android TV / Google TV: MAUI views in RadioE45/Views/Tv, same app as the phone
# (docs/ANDROID-TV-ROADMAP.md §5). 'todo' on tv is listed by ParityCheck --include-tv and blocks --strict-tv.
# TV is not about parity: 'n/a' (with tvNotes) is a permanent, legitimate answer for what is not needed or not usable with a remote.
#
# Initial inventory (S5a, v0.44): MAUI done, desktop and web todo until RadioE45.Uno exists.

