  notes: "Solo web (le app native si installano dagli store e dai pacchetti). Platforms/WebAssembly/manifest.webmanifest, icone in Platforms/WebAssembly/Pwa (bianche, logo nella zona sicura maskable); service worker di Uno (network-first) avvolto da wwwroot/radioe45-sw.js, che lascia al browser stream e richieste verso altre origini (Safari rifiuta la fetch del worker sulla porta Icecast); RadioE45Pwa.js lo registra e mette in cache uno-assets.txt. Lo stream e le API richiedono comunque la rete"

