# MAUI page ↔ Uno page map, read by tools/ParityCheck (docs/LINUX-UNO-ROADMAP.md §6.2).
#
#   page:        logical name, referenced by 'page' in features.yaml
#   maui:        MAUI XAML (every RadioE45/Views/*.xaml and RadioE45/AppShell.xaml must be listed)
#   uno:         Uno XAML (one project for desktop and web), or 'n/a' + reason
#   viewmodels:  ViewModels the page binds (RadioE45.Core/ViewModels)
#   ignore:      binding members or string keys used only by MAUI, each with a reason:
#                  - name: IsMuted
#                    reason: "..."
#   tv:          Android TV page (RadioE45/Views/Tv/*.xaml, MAUI, same app as the phone), or 'n/a' + tvReason
#   tvReason:    why the page has no TV counterpart (required when tv is 'n/a')
#   ignoreTv:    like 'ignore', for members or string keys of the phone page deliberately absent on TV
#                (touch-only: swipe, drag, pull to refresh). docs/ANDROID-TV-ROADMAP.md §5
#
# Uno pages expose the ViewModel as a 'ViewModel' property and bind with {x:Bind ViewModel.X}
# so that ParityCheck can compare them with the MAUI {Binding X} paths.

