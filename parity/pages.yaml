    - name: Glyph
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: HasContactLinks
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: HasSocialLinks
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: OpenChannelsCommand
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: OpenLinkCommand
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: OpenSettingsCommand
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: SocialLinks
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: StationLogoUrl
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: StationName
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: Uri.Host
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: Uri.OriginalString
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: Website
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: Menu_Contacts
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: Menu_Social
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: Menu_Website
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
    - name: Tab_Settings
      reason: "Menu laterale: su TV non c'è (decisione 2026-10-22); le voci Impostazioni e link della stazione sono n/a"
  viewmodels: [OnAirViewModel, AppMenuViewModel]
  ignore: []

- page: OnAir
  maui: RadioE45/Views/OnAirPage.xaml
  uno: RadioE45.Uno/Views/OnAirPage.xaml
  tv: RadioE45/Views/Tv/TvNowPlayingView.xaml
  ignoreTv:
    - name: ActivateAsync
      reason: "Lo chiama TvRootPage all'avvio (come OnAirPage.OnAppearing sul telefono)"
    - name: ArtworkHeight
      reason: "Altezza adattiva della copertina sul telefono; sulla TV è fissa a 340 dp"
    - name: Volume
      reason: "Il volume è del televisore e si regola dal telecomando (onair.volume n/a)"
    - name: IsMuted
      reason: "Il volume è del televisore (onair.volume n/a)"
    - name: SetVolumeCommand
      reason: "Il volume è del televisore (onair.volume n/a)"
    - name: ToggleMuteCommand
      reason: "Il volume è del televisore (onair.volume n/a)"
    - name: IsBusy
      reason: "Solo per il pull to refresh del telefono (onair.pull-to-refresh n/a)"
    - name: RefreshNowPlayingCommand
      reason: "Pull to refresh: su TV il now playing si aggiorna da solo (onair.pull-to-refresh n/a)"
    - name: Tab_OnAir
      reason: "Titolo della pagina MAUI; su TV l'etichetta è nel pulsante di sezione di TvRootPage"
  viewmodels: [OnAirViewModel]
  ignore:
    - name: Tab_OnAir
      reason: "MAUI page title; on Uno the tab label lives in ShellPage and the page has no title bar"
    - name: IsBusy
      reason: "MAUI RefreshView.IsRefreshing; the Uno RefreshContainer shows its indicator until the RefreshNowPlayingCommand deferral completes"

- page: RadioList
  maui: RadioE45/Views/RadioListPage.xaml
  uno: RadioE45.Uno/Views/RadioListPage.xaml
  tv: RadioE45/Views/Tv/TvStationsView.xaml
  ignoreTv:
    - name: MoveStationAsync
      reason: "Riordino col trascinamento: non esiste col D-pad (radiolist.reorder n/a)"
    - name: MoveStationToEndAsync
      reason: "Riordino col trascinamento: non esiste col D-pad (radiolist.reorder n/a)"
    - name: Common_Delete
      reason: "Etichetta della voce di swipe del telefono; su TV l'eliminazione è un'azione sulla stazione (T4)"
    - name: Tab_Radio
      reason: "Titolo della pagina MAUI; su TV l'etichetta è nel pulsante di sezione di TvRootPage"
  viewmodels: [RadioListViewModel]
  ignore:
    - name: Common_Delete
      reason: "Label of the MAUI SwipeView delete item (touch only); on Uno edit/delete are in the context menu, which uses RadioList_DeleteStation as in MAUI"

