# Publishes the Uno web app (net10.0-browserwasm) to GitHub Pages:
# https://delfuria.github.io/RadioE45/
#
# Project pages live in a sub-folder, so the app is published with WasmShellWebAppBasePath=/RadioE45/
# (base href and bootstrapper paths). The PWA manifest and service worker use relative paths and
# work under any base. One-time setup: Settings > Pages > Source = "GitHub Actions".
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - RadioE45.Uno/**
      - RadioE45.Core/**
      - global.json
      - version.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # NBGV computes the version from the git height

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: >
          dotnet publish RadioE45.Uno -f net10.0-browserwasm -c Release
          -p:WasmShellWebAppBasePath=/RadioE45/ -o publish -nologo

      - name: Prepare the site
        run: |
          # The static site is the wwwroot folder of the publish output.
          mv publish/wwwroot site
          # Pages must not run Jekyll (it hides the package_* and _framework-like folders).
          touch site/.nojekyll
          # Pages has no rewrite rules: unknown paths get the app instead of a plain 404.
          cp site/index.html site/404.html
          find site -maxdepth 2 \( -name index.html -o -name 404.html -o -name manifest.webmanifest -o -name radioe45-sw.js \) | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
